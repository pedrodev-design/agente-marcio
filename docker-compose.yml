version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: agente_marcio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-senha}
      MYSQL_DATABASE: ${DB_NAME:-agente_marcio}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  adminer:
    image: adminer:4
    container_name: agente_marcio_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
volumes:
  mysql_data:
